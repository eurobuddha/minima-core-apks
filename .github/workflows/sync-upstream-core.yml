name: sync-upstream-core

# Keep the Official "Minima Core" catalog row in sync with spartacusrex's latest
# committed dist/minima-*.apk. spartacusrex ships no GitHub releases, so nothing
# else pulls a new version in — this runs hourly and on demand.
#
# scripts/sync-upstream-core.py does the work and its own gating (signer-cert pin,
# version + check.py). On a new, verified version it commits and pushes; on a cert
# mismatch or any failure it exits non-zero and this job fails WITHOUT pushing. A run with no new version is a clean no-op.

on:
  schedule:
    - cron: "43 * * * *"      # hourly, away from the busy start of the hour
  workflow_dispatch:           # manual "Run workflow" button

permissions:
  contents: write              # commit + push, and upload to the `mirrors` release

concurrency:
  group: sync-upstream-core    # never let two runs race the catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0        # check.py reads HEAD:apks.json for the downgrade guard

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"    # apksigner needs a JDK

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;36.0.0" # avoid removed legacy `tools` package

      - name: Test updater safety and retry paths
        run: python3 -B -m unittest discover -s tests -v

      - name: Configure git identity
        run: |
          git config user.name  "minima-core-apks bot"
          git config user.email "eurobuddha@gmail.com"

      - name: Sync Official Minima Core to upstream latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B scripts/sync-upstream-core.py --push
